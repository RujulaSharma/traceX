services:
  - type: web
    name: tracex-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: tracex-postgres
          property: connectionString
      - key: CORS_ORIGINS
        value: http://localhost:5173
      - key: FRONTEND_URL
        sync: false

databases:
  - name: tracex-postgres
    plan: free
    databaseName: tracex
    user: tracex
