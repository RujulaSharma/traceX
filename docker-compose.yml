version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: tracex-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracex_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-tracex}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tracex}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tracex-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tracex}:${POSTGRES_PASSWORD:-tracex_dev_password}@db:5432/${POSTGRES_DB:-tracex}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app

volumes:
  postgres_data:
